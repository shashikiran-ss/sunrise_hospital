<!-- FILE NAME: patient.html -->
<!-- Sunrise Hospital - Patient Registration Page -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | Sunrise Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header and Navigation -->
    <header class="header">
        <a href="index.html" class="logo">
            <span class="logo-icon">✚</span>
            Sunrise Hospital
        </a>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#about">About</a>
            <a href="patient.html" class="active">Register</a>
        </nav>
    </header>

    <!-- Patient Registration Section -->
    <section class="patient-section">

        <div class="patient-container">

            <h1>Patient Registration</h1>

            <p>
                Please fill in your details to register
                for an appointment at Sunrise Hospital.
            </p>

            <!-- Connected to PHP Backend -->
            <form
                id="patientForm"
                class="patient-form"
                action="test.php"
                method="POST">

                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required>

                <label for="dob">Date of Birth</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required>

                <label for="gender">Gender</label>
                <select
                    id="gender"
                    name="gender"
                    required>

                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>

                </select>

                <label for="department">Department</label>
                <select
                    id="department"
                    name="department"
                    required>

                    <option value="">Select Department</option>
                    <option value="General Medicine">General Medicine</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Dermatology">Dermatology</option>

                </select>

                <label for="address">Address</label>
                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your full address"
                    required></textarea>

                <label for="appointment">Appointment Date</label>
                <input
                    type="date"
                    id="appointment"
                    name="appointment"
                    required>

                <button type="submit">
                    Submit Registration
                </button>

            </form>

        </div>

    </section>

    <!-- Footer -->
    <footer class="footer">

        <p>
            Sunrise Hospital — Your Health, Our Priority.
        </p>

        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#about">About</a>
            <a href="patient.html">Register</a>
        </div>

        <p class="copyright">
            &copy; 2026 Sunrise Hospital. All rights reserved.
        </p>

    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
